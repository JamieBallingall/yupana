# A release, made by pushing a tag such as v0.3.0. It runs the checks of CI, refuses a tag that
# differs from the version in Cargo.toml (which the bundle reports as its own), publishes
# yup.mjs, yup.d.ts and yup.html as the release's files, and puts the same files on the project's
# GitHub Pages site, with yup.html as its front page. GitHub adds the source as a zip and a
# tarball to every release.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Releases go out one at a time and are never cancelled half way.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  bundle:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install --no-self-update

      - name: Check that the tag names the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "yup-core") | .version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, and Cargo.toml says $version"
            exit 1
          fi

      - name: Bundle
        run: cargo run -p yup-bundle

      # The site serves the page as its front page, beside the library it was built with.
      - name: Gather the files
        run: |
          mkdir -p site
          cp target/yup.mjs target/yup.d.ts target/yup.html site/
          cp target/yup.html site/index.html

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            target/yup.mjs
            target/yup.d.ts
            target/yup.html
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  release:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bundle

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" yup.mjs yup.d.ts yup.html \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  pages:
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
