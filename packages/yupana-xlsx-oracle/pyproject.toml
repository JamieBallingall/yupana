[project]
name = "yupana-xlsx-oracle"
version = "0.1.0"
description = "Has the spreadsheet app compute a .yup or xlsx file, for checking."
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pywin32>=312 ; sys_platform == 'win32'",
    "yupana",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yupana_xlsx_oracle"]

[tool.uv.sources]
yupana = { workspace = true }
